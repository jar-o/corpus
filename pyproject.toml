[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "corpus"
version = "0.4.0"
description = "Find the few documents that answer a question, by meaning, so LLMs read less."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12",
    "spacy>=3.7,<4",
    "pytextrank>=3.3",
    "gensim>=4.3",
    "pypdf>=4",
    "python-docx>=1.1",
    "fastembed>=0.4",
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
corpus = "corpus.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: runs the full pipeline on the 85-document Federalist corpus"]
pythonpath = ["tests"]
